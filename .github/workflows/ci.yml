name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dev dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Scoped checks (PR)
        if: github.event_name == 'pull_request'
        run: scripts/check.sh --scope auto --base "origin/${{ github.base_ref }}"
      - name: Full checks (main / manual)
        if: github.event_name != 'pull_request'
        run: scripts/check.sh --scope all
