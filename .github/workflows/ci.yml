name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read  # traceability --verify-provenance reads CI runs for passed entries

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/worker/go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt -r services/api/requirements.lock -r services/parser/requirements.lock -r contracts/requirements.lock
      - name: Start PostgreSQL + pgvector (deploy/compose.dev.yml)
        run: docker compose -f deploy/compose.dev.yml up -d --wait
      - name: Scoped checks (PR)
        env:
          LAB_TEST_DATABASE_URL: postgresql://lab:lab-dev-only@127.0.0.1:55432/lab
          GH_TOKEN: ${{ github.token }}
          LAB_TEST_REPORT_DIR: ${{ runner.temp }}/test-reports
          LAB_PDF_FIXTURE_REPORT_DIR: ${{ runner.temp }}/pdf-fixture-evidence
        if: github.event_name == 'pull_request'
        run: scripts/check.sh --scope auto --base "origin/${{ github.base_ref }}"
      - name: Full checks (main / manual)
        env:
          LAB_TEST_DATABASE_URL: postgresql://lab:lab-dev-only@127.0.0.1:55432/lab
          GH_TOKEN: ${{ github.token }}
          LAB_TEST_REPORT_DIR: ${{ runner.temp }}/test-reports
          LAB_PDF_FIXTURE_REPORT_DIR: ${{ runner.temp }}/pdf-fixture-evidence
        if: github.event_name != 'pull_request'
        run: scripts/check.sh --scope all
      - name: Upload per-test reports (traceability execution evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: ${{ runner.temp }}/test-reports/
          if-no-files-found: warn
          retention-days: 90
      - name: Upload synthetic PDFium fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-fixture-evidence
          path: ${{ runner.temp }}/pdf-fixture-evidence/
          if-no-files-found: warn
          retention-days: 90
      - name: Stop database
        if: always()
        run: docker compose -f deploy/compose.dev.yml down -v
