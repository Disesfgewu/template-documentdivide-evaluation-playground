name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      probe:
        description: "Also run the CI-only Unstructured probe (Issue #7 item 4)"
        type: boolean
        default: false
      e2e:
        description: "Also run the real end-to-end parse acceptance (Issue #7)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read  # traceability --verify-provenance reads CI runs for passed entries

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/worker/go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt -r services/api/requirements.lock -r services/parser/requirements.lock -r contracts/requirements.lock -r db/requirements.lock
      - name: Start PostgreSQL + pgvector (deploy/compose.dev.yml)
        run: docker compose -f deploy/compose.dev.yml up -d --wait
      - name: Runtime container images smoke test (API & Parser)
        env:
          LAB_TEST_DATABASE_URL: postgresql://lab:lab-dev-only@127.0.0.1:55432/lab
          LAB_SMOKE_REPORT_DIR: ${{ runner.temp }}/smoke-report
        run: python -m deploy.runtime_smoke
      - name: Build web distribution
        run: cd web && npm ci && npm run build
      - name: Docker migration job (Alembic in the migrate image)
        run: |
          set -euo pipefail
          compose="docker compose -f deploy/compose.dev.yml"
          expected="$(ls db/lab_db/migrations/*.sql | wc -l)"
          $compose exec -T db psql -U lab -d lab -v ON_ERROR_STOP=1 -c 'CREATE DATABASE lab_migrate_check'
          $compose --profile tools run --rm \
            -e LAB_MIGRATION_DATABASE_URL=postgresql://lab:lab-dev-only@db:5432/lab_migrate_check \
            migrate -x deployment=ci upgrade head
          $compose --profile tools run --rm \
            -e LAB_MIGRATION_DATABASE_URL=postgresql://lab:lab-dev-only@db:5432/lab_migrate_check \
            migrate -x deployment=ci upgrade head   # a second run changes nothing
          rows="$($compose exec -T db psql -U lab -d lab_migrate_check -tA -c 'SELECT count(*) FROM schema_migrations')"
          head="$($compose exec -T db psql -U lab -d lab_migrate_check -tA -c 'SELECT version_num FROM alembic_version')"
          test "$rows" = "$expected" && test "$head" = "$(printf '%04d' "$expected")" \
            || { echo "unexpected schema state: rows=$rows head=$head expected=$expected"; exit 1; }
          $compose exec -T db psql -U lab -d lab -v ON_ERROR_STOP=1 -c 'DROP DATABASE lab_migrate_check'
      - name: Scoped checks (PR)
        env:
          LAB_TEST_DATABASE_URL: postgresql://lab:lab-dev-only@127.0.0.1:55432/lab
          GH_TOKEN: ${{ github.token }}
          LAB_TEST_REPORT_DIR: ${{ runner.temp }}/test-reports
          LAB_PDF_FIXTURE_REPORT_DIR: ${{ runner.temp }}/pdf-fixture-evidence
          LAB_BROWSER_EVIDENCE_DIR: ${{ runner.temp }}/browser-acceptance-evidence
        if: github.event_name == 'pull_request'
        run: scripts/check.sh --scope auto --base "origin/${{ github.base_ref }}"
      - name: Full checks (main / manual)
        env:
          LAB_TEST_DATABASE_URL: postgresql://lab:lab-dev-only@127.0.0.1:55432/lab
          GH_TOKEN: ${{ github.token }}
          LAB_TEST_REPORT_DIR: ${{ runner.temp }}/test-reports
          LAB_PDF_FIXTURE_REPORT_DIR: ${{ runner.temp }}/pdf-fixture-evidence
          LAB_BROWSER_EVIDENCE_DIR: ${{ runner.temp }}/browser-acceptance-evidence
        if: github.event_name != 'pull_request'
        run: scripts/check.sh --scope all
      - name: Upload per-test reports (traceability execution evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: ${{ runner.temp }}/test-reports/
          if-no-files-found: warn
          retention-days: 90
      - name: Upload browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance-evidence
          path: ${{ runner.temp }}/browser-acceptance-evidence/
          if-no-files-found: ignore
          retention-days: 90
      - name: Upload synthetic PDFium fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-fixture-evidence
          path: ${{ runner.temp }}/pdf-fixture-evidence/
          if-no-files-found: warn
          retention-days: 90
      - name: Upload runtime container smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-container-smoke-report
          path: ${{ runner.temp }}/smoke-report/
          if-no-files-found: warn
          retention-days: 90
      - name: Stop database
        if: always()
        run: docker compose -f deploy/compose.dev.yml down -v

  unstructured-probe:
    name: unstructured-probe (synthetic, manual)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Throwaway venv with the pinned package
        run: |
          python -m venv "$RUNNER_TEMP/probe-venv"
          "$RUNNER_TEMP/probe-venv/bin/pip" install -r services/parser/requirements.lock -r contracts/requirements.lock
          "$RUNNER_TEMP/probe-venv/bin/pip" install "unstructured[pdf]==0.27.36"
          "$RUNNER_TEMP/probe-venv/bin/pip" freeze > "$RUNNER_TEMP/probe-freeze.txt"
      - name: Run the probe
        env:
          PYTHONPATH: contracts:services/parser
        run: |
          set -o pipefail
          "$RUNNER_TEMP/probe-venv/bin/python" -I -c "import sys; sys.path[:0]=['contracts','services/parser','.']; import runpy; runpy.run_path('deploy/unstructured_probe.py', run_name='__main__')" | tee "$RUNNER_TEMP/probe-report.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unstructured-probe
          path: |
            ${{ runner.temp }}/probe-report.json
            ${{ runner.temp }}/probe-freeze.txt

  e2e-parse:
    name: e2e-parse (synthetic, manual)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.e2e }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start PostgreSQL + pgvector (deploy/compose.dev.yml)
        run: docker compose -f deploy/compose.dev.yml up -d --wait
      - name: Throwaway venv with the repo locks and the pinned package
        run: |
          python -m venv "$RUNNER_TEMP/e2e-venv"
          "$RUNNER_TEMP/e2e-venv/bin/pip" install -r services/api/requirements.lock -r services/parser/requirements.lock -r contracts/requirements.lock -r db/requirements.lock
          "$RUNNER_TEMP/e2e-venv/bin/pip" install "unstructured[pdf]==0.27.36"
          "$RUNNER_TEMP/e2e-venv/bin/pip" freeze > "$RUNNER_TEMP/e2e-freeze.txt"
