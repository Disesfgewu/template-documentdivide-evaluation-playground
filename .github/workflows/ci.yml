name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      probe:
        description: "Also run the CI-only Unstructured probe (Issue #7 item 4)"
        type: boolean
        default: false
      e2e:
        description: "Also run the real end-to-end parse acceptance (Issue #7)"
        type: boolean
        default: false
      worker_image:
        description: "Also build and smoke-test the parse worker container image (Issue #7)"
        type: boolean
        default: false
      llm_smoke:
        description: "Also run the real LLM provider smoke (needs secrets; fails as BLOCKED without them)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read  # traceability --verify-provenance reads CI runs for passed entries

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/worker/go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt -r services/api/requirements.lock -r services/parser/requirements.lock -r contracts/requirements.lock -r db/requirements.lock
      - name: Start PostgreSQL + pgvector (deploy/compose.dev.yml)
        run: docker compose -f deploy/compose.dev.yml up -d --wait
      - name: Runtime container images smoke test (API & Parser)
        env:
          LAB_TEST_DATABASE_URL: postgresql://lab:lab-dev-only@127.0.0.1:55432/lab
          LAB_SMOKE_REPORT_DIR: ${{ runner.temp }}/smoke-report
        run: python -m deploy.runtime_smoke
      - name: Build web distribution
        run: cd web && npm ci && npm run build
      - name: Docker migration job (Alembic in the migrate image)
        run: |
          set -euo pipefail
          compose="docker compose -f deploy/compose.dev.yml"
          expected="$(ls db/lab_db/migrations/*.sql | wc -l)"
          $compose exec -T db psql -U lab -d lab -v ON_ERROR_STOP=1 -c 'CREATE DATABASE lab_migrate_check'
          $compose --profile tools run --rm \
            -e LAB_MIGRATION_DATABASE_URL=postgresql://lab:lab-dev-only@db:5432/lab_migrate_check \
            migrate -x deployment=ci upgrade head
          $compose --profile tools run --rm \
            -e LAB_MIGRATION_DATABASE_URL=postgresql://lab:lab-dev-only@db:5432/lab_migrate_check \
            migrate -x deployment=ci upgrade head   # a second run changes nothing
          rows="$($compose exec -T db psql -U lab -d lab_migrate_check -tA -c 'SELECT count(*) FROM schema_migrations')"
          head="$($compose exec -T db psql -U lab -d lab_migrate_check -tA -c 'SELECT version_num FROM alembic_version')"
          test "$rows" = "$expected" && test "$head" = "$(printf '%04d' "$expected")" \
            || { echo "unexpected schema state: rows=$rows head=$head expected=$expected"; exit 1; }
          $compose exec -T db psql -U lab -d lab -v ON_ERROR_STOP=1 -c 'DROP DATABASE lab_migrate_check'
      - name: Scoped checks (PR)
        env:
          LAB_TEST_DATABASE_URL: postgresql://lab:lab-dev-only@127.0.0.1:55432/lab
          GH_TOKEN: ${{ github.token }}
          LAB_TEST_REPORT_DIR: ${{ runner.temp }}/test-reports
          LAB_PDF_FIXTURE_REPORT_DIR: ${{ runner.temp }}/pdf-fixture-evidence
          LAB_BROWSER_EVIDENCE_DIR: ${{ runner.temp }}/browser-acceptance-evidence
        if: github.event_name == 'pull_request'
        run: scripts/check.sh --scope auto --base "origin/${{ github.base_ref }}"
      - name: Full checks (main / manual)
        env:
          LAB_TEST_DATABASE_URL: postgresql://lab:lab-dev-only@127.0.0.1:55432/lab
          GH_TOKEN: ${{ github.token }}
          LAB_TEST_REPORT_DIR: ${{ runner.temp }}/test-reports
          LAB_PDF_FIXTURE_REPORT_DIR: ${{ runner.temp }}/pdf-fixture-evidence
          LAB_BROWSER_EVIDENCE_DIR: ${{ runner.temp }}/browser-acceptance-evidence
        if: github.event_name != 'pull_request'
        run: scripts/check.sh --scope all
      - name: Upload per-test reports (traceability execution evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: ${{ runner.temp }}/test-reports/
          if-no-files-found: warn
          retention-days: 90
      - name: Upload browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance-evidence
          path: ${{ runner.temp }}/browser-acceptance-evidence/
          if-no-files-found: ignore
          retention-days: 90
      - name: Upload synthetic PDFium fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-fixture-evidence
          path: ${{ runner.temp }}/pdf-fixture-evidence/
          if-no-files-found: warn
          retention-days: 90
      - name: Upload runtime container smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-container-smoke-report
          path: ${{ runner.temp }}/smoke-report/
          if-no-files-found: warn
          retention-days: 90
      - name: Stop database
        if: always()
        run: docker compose -f deploy/compose.dev.yml down -v

  unstructured-probe:
    name: unstructured-probe (synthetic, manual)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Throwaway venv with the pinned package
        run: |
          python -m venv "$RUNNER_TEMP/probe-venv"
          "$RUNNER_TEMP/probe-venv/bin/pip" install -r services/parser/requirements.lock -r contracts/requirements.lock
          "$RUNNER_TEMP/probe-venv/bin/pip" install "unstructured[pdf]==0.27.36"
          "$RUNNER_TEMP/probe-venv/bin/pip" freeze > "$RUNNER_TEMP/probe-freeze.txt"
      - name: Run the probe
        env:
          PYTHONPATH: contracts:services/parser
        run: |
          set -o pipefail
          "$RUNNER_TEMP/probe-venv/bin/python" -I -c "import sys; sys.path[:0]=['contracts','services/parser','.']; import runpy; runpy.run_path('deploy/unstructured_probe.py', run_name='__main__')" | tee "$RUNNER_TEMP/probe-report.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unstructured-probe
          path: |
            ${{ runner.temp }}/probe-report.json
            ${{ runner.temp }}/probe-freeze.txt

  e2e-parse:
    name: e2e-parse (synthetic, manual)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.e2e }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start PostgreSQL + pgvector (deploy/compose.dev.yml)
        run: docker compose -f deploy/compose.dev.yml up -d --wait
      - name: Throwaway venv with the repo locks and the pinned package
        run: |
          python -m venv "$RUNNER_TEMP/e2e-venv"
          "$RUNNER_TEMP/e2e-venv/bin/pip" install -r services/api/requirements.lock -r services/parser/requirements.lock -r contracts/requirements.lock -r db/requirements.lock
          "$RUNNER_TEMP/e2e-venv/bin/pip" install "unstructured[pdf]==0.27.36"
          "$RUNNER_TEMP/e2e-venv/bin/pip" freeze > "$RUNNER_TEMP/e2e-freeze.txt"
      - name: End-to-end acceptance
        env:
          LAB_TEST_DATABASE_URL: postgresql://lab:lab-dev-only@127.0.0.1:55432/lab
          LAB_E2E_REAL_UNSTRUCTURED: "1"
        run: |
          set -o pipefail
          export LAB_E2E_REPORT="$RUNNER_TEMP/e2e-report.json"
          "$RUNNER_TEMP/e2e-venv/bin/python" -m unittest -v tests.e2e.test_parse_e2e_real 2>&1 | tee "$RUNNER_TEMP/e2e-log.txt"
          cat "$RUNNER_TEMP/e2e-report.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-parse
          path: |
            ${{ runner.temp }}/e2e-report.json
            ${{ runner.temp }}/e2e-freeze.txt
            ${{ runner.temp }}/e2e-log.txt
      - name: Stop PostgreSQL
        if: always()
        run: docker compose -f deploy/compose.dev.yml down -v

  llm-smoke:
    name: llm-smoke (real provider, manual)
    # Secrets are only ever handed to code on main, through the protected environment 'llm-smoke'
    # (configure required reviewers there): a dispatch on any other ref skips this job.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.llm_smoke && github.ref == 'refs/heads/main' }}
    environment: llm-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Require credentials (a missing one is BLOCKED, never a pass)
        env:
          AGENTKIT_READ_TOKEN: ${{ secrets.AGENTKIT_READ_TOKEN }}
          LAB_LLM_SMOKE_API_KEY: ${{ secrets.LAB_LLM_SMOKE_API_KEY }}
          LAB_LLM_SMOKE_BASE_URL: ${{ vars.LAB_LLM_SMOKE_BASE_URL }}
          LAB_LLM_SMOKE_ALLOWED_HOST: ${{ vars.LAB_LLM_SMOKE_ALLOWED_HOST }}
          LAB_LLM_SMOKE_MODEL: ${{ vars.LAB_LLM_SMOKE_MODEL }}
          LAB_LLM_SMOKE_PRICE_IN_MICROS_PER_MTOK: ${{ vars.LAB_LLM_SMOKE_PRICE_IN_MICROS_PER_MTOK }}
          LAB_LLM_SMOKE_PRICE_OUT_MICROS_PER_MTOK: ${{ vars.LAB_LLM_SMOKE_PRICE_OUT_MICROS_PER_MTOK }}
        run: |
          missing=""
          for name in AGENTKIT_READ_TOKEN LAB_LLM_SMOKE_API_KEY LAB_LLM_SMOKE_BASE_URL LAB_LLM_SMOKE_ALLOWED_HOST LAB_LLM_SMOKE_MODEL \
                      LAB_LLM_SMOKE_PRICE_IN_MICROS_PER_MTOK LAB_LLM_SMOKE_PRICE_OUT_MICROS_PER_MTOK; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            printf '{"status":"blocked","reason":"blocked: no credentials or configuration (%s )","real":false}\n' "$missing" > "$RUNNER_TEMP/llm-smoke-report.json"
            echo "::error::BLOCKED: no credentials or configuration:$missing"
            exit 1
          fi
      - name: Check out the private agentKit pin (token scoped to this one command)
        env:
          AGENTKIT_READ_TOKEN: ${{ secrets.AGENTKIT_READ_TOKEN }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$AGENTKIT_READ_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" submodule update --init --checkout -- third_party/agentkit
          test "$(git rev-parse HEAD:third_party/agentkit)" = "$(git -C third_party/agentkit rev-parse HEAD)"
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/worker/agentflow/go.mod
          cache: false
      - name: Real provider smoke
        env:
          GOTOOLCHAIN: local
          LAB_LLM_SMOKE_API_KEY: ${{ secrets.LAB_LLM_SMOKE_API_KEY }}
          LAB_LLM_SMOKE_BASE_URL: ${{ vars.LAB_LLM_SMOKE_BASE_URL }}
          LAB_LLM_SMOKE_ALLOWED_HOST: ${{ vars.LAB_LLM_SMOKE_ALLOWED_HOST }}
          LAB_LLM_SMOKE_MODEL: ${{ vars.LAB_LLM_SMOKE_MODEL }}
          LAB_LLM_SMOKE_PRICE_IN_MICROS_PER_MTOK: ${{ vars.LAB_LLM_SMOKE_PRICE_IN_MICROS_PER_MTOK }}
          LAB_LLM_SMOKE_PRICE_OUT_MICROS_PER_MTOK: ${{ vars.LAB_LLM_SMOKE_PRICE_OUT_MICROS_PER_MTOK }}
        run: |
          set -euo pipefail
          export LAB_LLM_SMOKE_REPORT="$RUNNER_TEMP/llm-smoke-report.json"
          # Everything in the private-module package (this is the only CI path that compiles it, so the
          # harness tests against local fakes run here too), then the real call.
          (cd services/worker/agentflow && go vet ./... && go test -count=1 -skip '^TestRealProviderSmoke$' ./... && go test -count=1 -run '^TestRealProviderSmoke$' -v ./...)
          python3 - "$LAB_LLM_SMOKE_REPORT" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          print(json.dumps(report, indent=2, sort_keys=True))
          sys.exit(0 if report.get("status") == "passed" and report.get("real") is True else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: llm-smoke
          if-no-files-found: warn
          path: ${{ runner.temp }}/llm-smoke-report.json

  worker-image:
    name: worker-image (synthetic, manual)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.worker_image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL and apply the schema
        run: |
          set -euo pipefail
          compose="docker compose -f deploy/compose.dev.yml"
          $compose up -d --wait db
          $compose --profile tools run --rm -e LAB_MIGRATION_DATABASE_URL=postgresql://lab:lab-dev-only@db:5432/lab migrate -x deployment=ci upgrade head
      - name: Build and start the worker service (read-only root, non-root, no capabilities)
        run: |
          set -euo pipefail
          docker compose -f deploy/compose.dev.yml --profile worker up -d --build --wait --wait-timeout 300 parse-worker
          cid="$(docker compose -f deploy/compose.dev.yml ps -q parse-worker)"
          echo "$cid" > "$RUNNER_TEMP/worker-cid"
          docker image inspect lab-dev-parse-worker --format 'image size bytes: {{.Size}}' | tee "$RUNNER_TEMP/worker-image.txt"
          docker inspect "$cid" --format 'user={{.Config.User}} readonly={{.HostConfig.ReadonlyRootfs}} capdrop={{.HostConfig.CapDrop}} secopt={{.HostConfig.SecurityOpt}} memory={{.HostConfig.Memory}} pids={{.HostConfig.PidsLimit}} health={{.State.Health.Status}}' | tee -a "$RUNNER_TEMP/worker-image.txt"
          test "$(docker inspect "$cid" --format '{{.State.Health.Status}}')" = healthy
          test "$(docker inspect "$cid" --format '{{.HostConfig.ReadonlyRootfs}}')" = true
          test "$(docker inspect "$cid" --format '{{.Config.User}}')" = "10001:10001"
      - name: The image carries no secrets
        run: |
          set -euo pipefail
          if docker history --no-trunc lab-dev-parse-worker | grep -Ei 'secret|password|token|api[_-]?key'; then
            echo "::error::a secret-looking string is in the image history"; exit 1
          fi
          if docker image inspect lab-dev-parse-worker --format '{{json .Config.Env}}' | grep -Ei 'lab_database_url|lab_auth_secret|password|token'; then
            echo "::error::a secret-looking value is baked into the image environment"; exit 1
          fi
      - name: Real parse inside the running container (synthetic one-page PDF)
        run: |
          set -euo pipefail
          cid="$(cat "$RUNNER_TEMP/worker-cid")"
          docker exec -i "$cid" python - < deploy/worker_smoke.py | tee "$RUNNER_TEMP/worker-smoke.json"
      - name: Graceful stop
        run: |
          set -euo pipefail
          cid="$(cat "$RUNNER_TEMP/worker-cid")"
          began=$(date +%s)
          docker stop -t 90 "$cid"
          echo "stop seconds: $(( $(date +%s) - began )); exit code: $(docker inspect "$cid" --format '{{.State.ExitCode}}')" | tee -a "$RUNNER_TEMP/worker-image.txt"
      - name: Container log (fixed codes and ids only)
        if: always()
        run: |
          docker compose -f deploy/compose.dev.yml --profile worker logs --no-color parse-worker > "$RUNNER_TEMP/worker-log.txt" 2>&1 || true
          tail -n 40 "$RUNNER_TEMP/worker-log.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worker-image
          path: |
            ${{ runner.temp }}/worker-image.txt
            ${{ runner.temp }}/worker-smoke.json
            ${{ runner.temp }}/worker-log.txt
      - name: Clean up
        if: always()
        run: docker compose -f deploy/compose.dev.yml --profile worker --profile tools down -v
