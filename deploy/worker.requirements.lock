# Pinned dependencies of the parse worker image (deploy/worker.Dockerfile), Refs #7.
# Source: `pip freeze` of the CI e2e venv (artifact e2e-parse of run 42722343433: Python 3.12.16,
# services/api + services/parser + contracts + db locks, then unstructured[pdf]==0.27.36), with the
# CUDA stack (nvidia-*, cuda-*, triton) removed. This image runs the `fast` strategy on CPU, so torch and
# torchvision come from the CPU wheel index (same versions; the "+cpu" local version wins over PyPI's).
# unstructured 0.27.36 downloads the spaCy model en_core_web_sm into site-packages the first time it needs it
# and, when that fails (a read-only root, no network), silently returns NO elements (measured in the worker
# image smoke). The model is therefore installed here, pinned by hash, so the image never downloads at runtime.
# Regenerate the rest from a new e2e artifact and rebuild; do not edit by hand.
