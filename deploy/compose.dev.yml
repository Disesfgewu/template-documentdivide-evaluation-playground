# Local development dependencies. Start: docker compose -f deploy/compose.dev.yml up -d --wait
# Credentials below are for a throwaway local container only; never reuse them elsewhere.
name: lab-dev
services:
  db:
    # pgvector 0.8.6 on PostgreSQL 17, pinned by digest.
    image: pgvector/pgvector:0.8.6-pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab-dev-only
      POSTGRES_DB: lab
    ports:
      - "127.0.0.1:${LAB_DB_PORT:-55432}:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - lab-db:/var/lib/postgresql/data
    healthcheck:
      # TCP, not the unix socket: the init-time temporary server only listens on the socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U lab -d lab"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    # One-shot Alembic job, not started by `up`. Apply the schema with:
    #   docker compose -f deploy/compose.dev.yml --profile tools run --rm migrate
    profiles: ["tools"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.migrate
    environment:
      LAB_MIGRATION_DATABASE_URL: postgresql://lab:lab-dev-only@db:5432/lab
    depends_on:
      db:
        condition: service_healthy
  api:
    # The HTTP API for the quickstart demo (docs/QUICKSTART_DEMO.md). Not started by `up`; start it with
    #   docker compose -f deploy/compose.dev.yml --profile demo up -d --build --wait api
    # It shares the artifact volume with parse-worker (the API stores uploads, the worker reads them).
    # Throwaway dev credentials only; a real deployment injects its own environment and secret.
    profiles: ["demo"]
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    environment:
      LAB_ENV: dev
      LAB_PROVIDER_MODE: mock
      LAB_DATABASE_URL: postgresql://lab:lab-dev-only@db:5432/lab
      LAB_ARTIFACT_ROOT: /var/lib/lab/artifacts
      LAB_AUTH_SECRET: demo-only-signing-secret-never-use-outside-this-local-demo
    ports:
      - "127.0.0.1:${LAB_API_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=256m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    pids_limit: 200
    volumes:
      - lab-artifacts:/var/lib/lab/artifacts
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 3s
      timeout: 4s
      retries: 20
  parse-worker:
    # The document.parse worker (Refs #7). Not started by `up`; start it after the migration with:
    #   docker compose -f deploy/compose.dev.yml --profile worker up -d --build parse-worker
    # Throwaway dev credentials only (same as the db service); a real deployment injects its own environment.
    profiles: ["worker", "demo"]
    build:
      context: ..
      dockerfile: deploy/worker.Dockerfile
    environment:
      LAB_ENV: dev
      LAB_PROVIDER_MODE: mock
      LAB_DATABASE_URL: postgresql://lab:lab-dev-only@db:5432/lab
      LAB_ARTIFACT_ROOT: /var/lib/lab/artifacts
      LAB_AUTH_SECRET: dev-only-secret-not-used-by-the-worker-but-required-by-the-settings-loader
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=512m
    user: "10001:10001"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 6g            # two parser children at about 1.3 GB RSS each, measured in #123, plus headroom
    pids_limit: 200
    cpus: 2.0
    volumes:
      - lab-artifacts:/var/lib/lab/artifacts
    depends_on:
      db:
        condition: service_healthy
    # `compose stop/down` sends SIGTERM and waits this long before SIGKILL. The worker's own grace is 60 s
    # (--grace) plus up to 10 s to cancel and reap its parser children, so the default 10 s would kill a
    # worker in the middle of a job and skip the drain.
    stop_grace_period: 90s
    restart: unless-stopped
  generate-worker:
    # The document.generate worker (P-D, Refs #7). Not part of the `demo` profile: it needs a provider key, so it only
    # starts through `scripts/demo.sh generate` (profile "generate"). The key comes from the CALLER's environment
    # (LAB_GEN_API_KEY), is never stored in the image or this file, and goes only into the lab-gen child's environment.
    profiles: ["generate"]
    build:
      context: ..
      dockerfile: deploy/generate-worker.Dockerfile
      args:
        AGENTKIT_COMMIT: ${AGENTKIT_COMMIT:-}
    environment:
      LAB_ENV: dev
      LAB_PROVIDER_MODE: mock
      LAB_DATABASE_URL: postgresql://lab:lab-dev-only@db:5432/lab
      LAB_ARTIFACT_ROOT: /var/lib/lab/artifacts
      LAB_AUTH_SECRET: dev-only-secret-not-used-by-the-worker-but-required-by-the-settings-loader
      LAB_GEN_API_KEY: ${LAB_GEN_API_KEY:-}
      LAB_GEN_PROTOCOL: anthropic
      LAB_GEN_BASE_URL: https://api.anthropic.com
      LAB_GEN_ALLOWED_HOST: api.anthropic.com
      LAB_GEN_PRICE_IN_MICROS_PER_MTOK: ${LAB_GEN_PRICE_IN_MICROS_PER_MTOK:-1000000}
      LAB_GEN_PRICE_OUT_MICROS_PER_MTOK: ${LAB_GEN_PRICE_OUT_MICROS_PER_MTOK:-5000000}
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=128m
    user: "10001:10001"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 100
    volumes:
      - lab-artifacts:/var/lib/lab/artifacts      # the answering method reads the original PDF and stores its submissions
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 90s
    restart: "no"
volumes:
  lab-db:
  lab-artifacts:
